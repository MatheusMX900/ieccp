<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Acrecentei a descrição aqui também para o SEO-->
    <meta
      name="description"
      content="Notícias da Igreja Evangélica Congregacional de Cachoeira Paulista, sobre eventos,cultos e atividades da comunidade IECCP."
    />
    <title>IECCP - Notícias</title>

    <link rel="icon" type="image/svg+xml" href="img/ico.svg" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/gallery.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link rel="stylesheet" href="styles/noticia.css" />

    <link
      href="https://fonts.googleapis.com/css?family=Oswald"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <a href="index.html" class="branding">
        <img
          src="img/logo.png"
          alt="Igreja Evangélica Congregacional de Cachoeira Paulista | IECCP"
        />
        IECCP
      </a>

      <nav>
        <button id="btn-mobile" onclick="toggleMenu()">
          <div class="line1"></div>
          <div class="line2"></div>
          <div class="line3"></div>
        </button>

        <ul id="menu" role="menu">
          <li><a href="agenda.html">Agenda</a></li>
          <li><a href="pastoral.html">Pastoral</a></li>
          <li><a href="noticias.html">Notícias</a></li>
          <li><a href="missoes.html">Missões</a></li>
          <li><a href="sobre.html">Sobre a IECCP</a></li>
          <li>
            <button id="btn-tema" title="Mudar Tema">
              <i class="fa-solid fa-sun"></i>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="page-header">
        <h1>Notícias e Atividades</h1>
      </div>

      <div id="feed-container">
        <p style="text-align: center">Carregando notícias...</p>
      </div>
    </main>

    <template id="template-noticia">
      <article class="noticia-item">
        <div class="conteudo-texto">
          <span class="data-badge"></span>

          <h2></h2>

          <div class="texto-dinamico"></div>
        </div>

        <div class="conteudo-imagem">
          <img src="" alt="Imagem da Notícia" loading="lazy" />
        </div>
      </article>
    </template>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof carregarFeedNoticias === "function") {
          carregarFeedNoticias();
        }
      });
    </script>

    <footer>
      <p>Criado por Matheus Andrade e Luiz Charleaux © 2026 – IECCP</p>
    </footer>

    <script src="scripts/tema.js"></script>
    <script src="scripts/menu.js"></script>
    <script src="scripts/conteudo.js" defer></script>
  </body>
</html>
